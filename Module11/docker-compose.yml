services:

  # eureka-server
  eureka-server:
    build: ./Eureka-server
    container_name: eureka-server
    hostname: eureka-server
    ports:
      - "8761:8761"
    networks:
      - app-network

  # Основное приложение
  app:
    build: .
    container_name: main-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      - eureka-server
      - db
      - notification-service
    networks:
      - app-network

  # База данных
  db:
    image: postgres:14-alpine
    container_name: postgres-db
    environment:
      - POSTGRES_DB=Books
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  # Сервис уведомлений
  notification-service:
    build: ./NotificationService
    container_name: notification-service
    hostname: notification-service
    ports:
      - "8081:8081"
    depends_on:
      - eureka-server
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge