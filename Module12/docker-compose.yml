services:
  # Eureka Server 1
  eureka-server-1:
    build: ./Eureka-server
    container_name: eureka-server-1
    hostname: eureka-server-1
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=peer1
    networks:
      - app-network

  # Eureka Server 2
  eureka-server-2:
    build: ./Eureka-server
    container_name: eureka-server-2
    hostname: eureka-server-2
    ports:
      - "8762:8762"
    environment:
      - SPRING_PROFILES_ACTIVE=peer2
    networks:
      - app-network

  # Book-service
  app:
    build: .
    container_name: main-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      - eureka-server-1
      - eureka-server-2
      - db
      - notification-service
    networks:
      - app-network

  # Postgres db
  db:
    image: postgres:14-alpine
    container_name: postgres-db
    environment:
      - POSTGRES_DB=Books
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  # Notification-service
  notification-service:
    build: ./NotificationService
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE=http://eureka-server-1:8761/eureka/,http://eureka-server-2:8762/eureka/
    depends_on:
      - eureka-server-1
      - eureka-server-2
    networks:
      - app-network

networks:
  app-network:
    driver: bridge